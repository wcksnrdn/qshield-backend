[project]
name = "qshield"
version = "0.1.0"
description = "Verifikasi ikatan merchant-lokasi QRIS sebelum PIN entry."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
# Hanya dibutuhkan scripts/make_qr.py untuk mencetak dan memverifikasi
# prop fisik. Sengaja dipisah supaya layanan tidak ikut menyeret OpenCV.
props = [
    "qrcode",
    "pillow",
    "opencv-python-headless",
    "numpy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qshield = ["web/*.html"]
