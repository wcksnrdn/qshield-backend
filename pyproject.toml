[project]
name = "qshield"
version = "0.1.0"
description = "Verifikasi ikatan merchant-lokasi QRIS sebelum PIN entry."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
